pakete:
  - name: Feuerbestattung Basis Paket
    art: Feuerbestattung
    stufe: Basis
    preis: 2.750,00 €
    preis_zusatz: inkl. 19 % MwSt **
    beschreibung: Die Einäscherung ohne Trauerfeier, zwei Tagen Abschiednahme und erweitertem Überführungsgebiet rund um Freiburg.
    leistungen:
      - Persönliche Beratung durch Lichtblicke Bestattungen – telefonisch oder vor Ort
      - Überführung vom Sterbeort in Freiburg und Umgebung inkl. Überführungstrage mit Hygienelaken
      - Hygienische Grundversorgung, Einkleiden in ein Sterbehemd oder in eigene Kleidung sowie die würdevolle Einbettung
      - Kühlkosten für die ersten 5 Tage ab Abholung – jeder weitere Tag 50 Euro
      - Schlichter Kiefernholzsarg für die Einäscherung inklusive Innenausstattung
      - Überführung zum Krematorium Südbaden, Rückholung der Aschenkapsel
      - Kosten für das Krematorium Südbaden sowie für die gesetzlich vorgeschriebene zweite Leichenschau
      - Verwahrung der Urne bis zur Beisetzung
      - Überführung der Urne in Freiburg und Umgebung
      - Anmeldung, Überführung und vollständige Terminkoordination mit dem jeweiligen Beisetzungsort
      - Anzeige des Sterbefalls beim zuständigen Standesamt sowie Beantragung einer Sterbeurkunde
      - Abmeldung bei der Krankenkasse und der Rentenversicherung sowie ggf. Beantragung der dreimonatigen Übergangsrente für Witwen oder Witwer
      - Einfache Schmuckurne – hier geht es zu unserer Urnenauswahl für Urnen mit Aufpreis
      - 'Optional: Beschaffung fehlender Dokumente innerhalb Deutschlands, z. B. einer Eheurkunde oder eines Scheidungsurteils, gegen einen Aufpreis von 100 Euro'
    lieferungen:
      - Schlichter Kiefernsarg
      - Herren- oder Damentalar in Weiß
      - Schlichte Decke und Kissen aus Viskose mit Volant in Weiß
      - Urnenkapsel
      - Schmuckurne (Naturstoff, einfach)
    hinweis: |-
      **Hinweis:** Die Kosten für den Beisetzungsort sind nicht im Preis enthalten, da sie je nach Friedhof und Bestattungsart variieren. Wir beraten Sie individuell und finden gemeinsam die passende Lösung.

      (zzgl. Auslagen wie Sterbeurkunden, Arztkosten und Friedhofsgebühren)
